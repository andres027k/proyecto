<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #111 40%, rgb(116, 49, 49) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
            overflow: hidden; /* Evita scroll innecesario */
        }

        /* Tarjeta de recuperación */
        .recovery-card {
            background: rgba(26, 26, 26, 0.95);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 75, 43, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Título */
        h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff4b2b;
            text-shadow: 0 0 10px rgba(255, 75, 43, 0.5);
        }

        /* Inputs del formulario */
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
            font-size: 14px;
        }

        /* Efecto al hacer foco en los inputs */
        .form-control:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.8);
            background: #333;
            outline: none;
        }

        /* Etiquetas del formulario */
        label {
            color: #fff;
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
            text-align: left;
        }

        /* Botón personalizado */
        .btn-custom {
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.5);
            cursor: pointer;
            color: white;
        }

        /* Efecto hover en el botón principal */
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 75, 43, 0.8);
            background: linear-gradient(90deg, #ff3b1d, #ff3059);
        }

        /* Botón de volver al login */
        .btn-back {
            background: transparent;
            border: 2px solid #ff4b2b;
            width: 100%;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease-in-out;
            color: #ff4b2b;
            margin-top: 15px;
            cursor: pointer;
        }

        /* Efecto hover en el botón de volver */
        .btn-back:hover {
            background: #ff4b2b;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.5);
        }

        /* Animación de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mensajes de error (si los hay) */
        .form-text {
            color: #ff4b2b;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <h2>Recuperar Contraseña</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email">Correo Electrónico</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <div class="form-text">{{ form.email.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-custom">Enviar enlace de recuperación</button>
        </form>
        <a href="{% url 'login' %}" class="btn btn-back">Volver al Login</a>
    </div>
</body>
</html>
