<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #111 40%, rgb(116, 49, 49) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }
        .reset-card {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-custom {
            background-color: #ff0000;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-custom:hover {
            background-color: #cc0000;
        }
        .error-message {
            color: #ff5555;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .success-message {
            color: #55ff55;
            font-size: 1rem;
            margin-top: 10px;
        }
        .password-container {
            position: relative;
        }
        .password-container input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2 class="text-red mb-4">Restablecer Contraseña</h2>
        <form id="resetForm" method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label for="new_password1" class="form-label">Nueva Contraseña</label>
                <div class="password-container">
                    <input type="password" id="new_password1" name="new_password1" class="form-control" required>
                    <span class="toggle-password" onclick="togglePassword('new_password1')">👁️</span>
                </div>
                <div id="error_password1" class="error-message"></div>
            </div>
            <div class="mb-3 text-start">
                <label for="new_password2" class="form-label">Confirmar Contraseña</label>
                <div class="password-container">
                    <input type="password" id="new_password2" name="new_password2" class="form-control" required>
                    <span class="toggle-password" onclick="togglePassword('new_password2')">👁️</span>
                </div>
                <div id="error_password2" class="error-message"></div>
            </div>

            <div id="success_message" class="success-message" style="display: none;">
                ¡Contraseña restablecida con éxito! Redirigiendo...
            </div>

            <button type="submit" class="btn btn-custom">Confirmar</button>
        </form>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
        }

        document.getElementById("resetForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let password1 = document.getElementById("new_password1").value;
            let password2 = document.getElementById("new_password2").value;
            let errorPassword1 = document.getElementById("error_password1");
            let errorPassword2 = document.getElementById("error_password2");
            let successMessage = document.getElementById("success_message");

            // Reiniciar mensajes
            errorPassword1.innerText = "";
            errorPassword2.innerText = "";
            successMessage.style.display = "none";

            // Enviar datos al servidor mediante AJAX
            fetch(window.location.href, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: "new_password1=" + encodeURIComponent(password1) + "&new_password2=" + encodeURIComponent(password2)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    successMessage.style.display = "block";
                    setTimeout(function() {
                        window.location.href = data.redirect_url || "/login/";
                    }, 1000); // Redirige después de 1 segundo
                } else {
                    if (data.error.includes("8 caracteres")) {
                        errorPassword1.innerText = data.error;
                    } else {
                        errorPassword2.innerText = data.error;
                    }
                }
            })
            .catch(error => {
                errorPassword2.innerText = "Ocurrió un error. Intenta de nuevo.";
                console.error("Error:", error);
            });
        });

        // Ocultar mensajes de error al escribir
        document.getElementById("new_password1").addEventListener("input", function() {
            document.getElementById("error_password1").innerText = "";
        });

        document.getElementById("new_password2").addEventListener("input", function() {
            document.getElementById("error_password2").innerText = "";
        });
    </script>
</body>
</html>
