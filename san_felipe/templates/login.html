{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #111 40%, rgb(116, 49, 49) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }

        /* Tarjeta de login */
        .login-card {
            background: rgba(26, 26, 26, 0.95);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        /* Inputs del formulario */
        .form-control {
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        /* Efecto al hacer foco en los inputs */
        .form-control:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.8);
            outline: none;
        }

        /* Botón personalizado */
        .btn-custom {
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(255, 75, 43, 0.5);
            cursor: pointer;
        }

        /* Efecto hover en el botón */
        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 75, 43, 0.8);
        }

        /* Enlaces de registro y recuperación */
        .register-link a, .forgot-password a {
            color: #ff4b2b;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease-in-out;
        }

        /* Efecto hover en enlaces */
        .register-link a:hover, .forgot-password a:hover {
            text-decoration: underline;
            color: #ff416c;
        }

        /* Animación de aparición */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilos para el contenedor del ojo */
        .password-container {
            position: relative;
        }

        .password-container .form-control {
            padding-right: 40px; /* Espacio para el ícono */
        }

        .password-container .toggle-password {
            position: absolute;
            right: 10px;
            top: 65%; /* Ajustado para centrar mejor verticalmente */
            transform: translateY(-50%);
            cursor: pointer;
            color: #fff;
            font-size: 1.2rem;
            line-height: 1; /* Asegura que el ícono esté centrado */
        }

        /* Ajustamos el estilo del ícono cuando está en foco */
        .form-control:focus + .toggle-password {
            color: #ff4b2b;
        }
    </style>
</head>
<body>
    <main>
        <div class="messages">
            {% if messages %}
            <div>
                {% for message in messages %}
                    <div class="alert alert-success">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    
        <div class="login-card text-center">
            <h2 class="text-red mb-4">Inicio de Sesión</h2>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
                </div>
                <div class="mb-3 text-start password-container">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
                </div>
                <button type="submit" class="btn btn-custom">Ingresar</button>
            </form>
    
            <p class="mt-3 register-link">¿No tienes cuenta? <a href="/register/">Regístrate aquí</a></p>
            <p class="mt-2 forgot-password">¿Olvidaste tu contraseña? <a href="{% url 'password_reset' %}">Recupérala aquí</a></p>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let form = document.querySelector("form");
            let inputs = form.querySelectorAll("input");
            let messages = document.querySelector(".messages");

            // Funcionalidad para mostrar/ocultar contraseña
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#password');

            togglePassword.addEventListener('click', function () {
                // Alternar el tipo de input
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                // Alternar el ícono
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });

            // Ocultar mensajes al escribir
            inputs.forEach(input => {
                input.addEventListener("input", function () {
                    if (messages) {
                        messages.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>
