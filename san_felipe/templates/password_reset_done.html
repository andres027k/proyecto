<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #111 40%,rgb(116, 49, 49) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }
        .message-card {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-custom {
            background-color: #ff0000;
            border: none;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-custom:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="message-card">
        <h2 class="text-red mb-4">Correo enviado</h2>
        <p>Revisa tu correo para continuar con la recuperación de contraseña.</p>
    </div>
</body>
</html>
